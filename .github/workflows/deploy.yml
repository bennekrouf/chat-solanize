name: Deploy chat-solanize

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Build & restart chat-solanize
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: SSH into VPS and run chat-solanize deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 28m
          script: |
            sudo bash /opt/solanize/src/chat-solanize/deploy.sh
